<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>המדריך שלך · יעל חזקיהו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:#3D2559;color:#F6F1EA;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
  .box{max-width:520px;text-align:center}
  img.cover{width:220px;border-radius:10px;box-shadow:0 20px 44px rgba(0,0,0,.35);transform:rotate(-2deg);margin-bottom:28px}
  h1{font-family:'Karantina',sans-serif;font-weight:700;font-size:70px;line-height:1;color:#FFFFFF}
  h1 span{color:#E9CF86}
  p{font-size:19px;line-height:1.75;color:#E5D6F2;margin-top:16px}
  a.btn{display:inline-block;margin-top:28px;background:#C9A24A;color:#FFFFFF;font-weight:800;font-size:20px;text-decoration:none;padding:16px 42px;border-radius:32px}
  .sig{margin-top:34px;font-size:15px;color:#B9A8CC}
</style>
</head>
<body>
  <div class="box">
    <img class="cover" src="cover.png" alt="שער המדריך: לפני שהוא שואל את הצ&#x27;אט">
    <h1>איזה כיף <span>שאת כאן</span> 💜</h1>
    <p>המדריך שלך מחכה כאן למטה<br>ובכל יום חמישי יגיע אלייך ממני מכתב קצר, עם כלי אחד לבית</p>
    <a class="btn" href="before-the-chat.pdf" download>להורדת המדריך</a>
    <div class="sig">יעלי · איך כן · השינוי מתחיל כאן</div>
  </div>
</body>
</html>
